name: CI/CD

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: be

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5 # Upgraded to v5
        with:
            # Combines server and repository name (e.g., myregistry.azurecr.io/my-app)
            images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.ACR_REPOSITORY }}
            tags: |
              type=ref,event=branch
              type=ref,event=pr
              type=ref,event=tag
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
              type=sha

      - name: Build, tag, and push docker image to Azure Container Registry
        id: docker_build
        uses: docker/build-push-action@v6 # Upgraded to v6
        with:
          context: .
          file: .docker/Dockerfile
          platforms: ${{ secrets.BUILD_PLATFORMS || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          # Optimized GitHub Actions Native Cache (Faster and cleaner than registry caching)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$VM_SSH_KEY" > ~/.ssh/dev.key
          chmod 600 ~/.ssh/dev.key
          cat >>~/.ssh/config <<END
          Host dev
            HostName $VM_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/dev.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.VM_USERNAME }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}

      - name: Deploy main
        if: github.ref == 'refs/heads/master'
        run: ssh dev "cd /home/$SSH_USER/be-storyteller && ./deploy.sh"
        env:
          SSH_USER: ${{ secrets.VM_USERNAME }}